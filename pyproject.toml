[project]
name = "recommendation-lab"
version = "0.1.0"
description = "A local, traceable recommendation learning workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "pyarrow>=18,<24",
  "torch>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "duckdb>=1.2,<2",
  "lightgbm>=4.7,<5",
  "threadpoolctl>=3.5,<4",
  "scikit-learn>=1.6,<2",
  "transformers>=4.48,<5",
  "safetensors>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
notebooks = [
    "ipykernel>=6,<8",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "nbformat>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
